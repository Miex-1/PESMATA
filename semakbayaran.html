<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semak Bayaran — Pesmata</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#E9EEF2;--paper:#fff;--ink:#17212B;--muted:#66737F;--line:#D3DBE2;--accent:#8B2F5B;--accent-soft:#F4E4EC;--gold:#E8B84A;--green:#2E9E6B;--green-soft:#E3F5EC}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;min-height:100vh}
  header{max-width:720px;margin:0 auto;padding:40px 20px 8px}
  h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(32px,6vw,46px);margin:0;line-height:1}
  h1 em{color:var(--accent);font-style:italic}
  .sub{color:var(--muted);margin:6px 0 0;font-size:14px}
  main{max-width:720px;margin:0 auto;padding:20px 20px 60px}
  /* ---- Loader kucing ---- */
  #loader{display:flex;flex-direction:column;align-items:center;padding:30px 0 10px;gap:18px}
  #loader.hide{display:none}
  .cat{position:relative;width:150px;height:90px;color:var(--ink)}
  .cat .body{position:absolute;left:30px;top:24px;width:100px;height:42px;background:currentColor;border-radius:26px 30px 14px 22px}
  .cat .head{position:absolute;left:106px;top:8px;width:44px;height:40px;background:currentColor;border-radius:40% 45% 45% 40%}
  .cat .ear{position:absolute;top:-10px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid currentColor}
  .cat .ear.l{left:4px;transform:rotate(-12deg)}.cat .ear.r{left:24px;transform:rotate(12deg)}
  .cat .eye{position:absolute;top:16px;width:6px;height:6px;border-radius:50%;background:var(--bg);animation:blink 3s infinite}
  .cat .eye.l{left:14px}.cat .eye.r{left:30px}
  .cat .tail{position:absolute;left:4px;top:18px;width:36px;height:12px;background:currentColor;border-radius:12px 0 0 12px;transform-origin:right center;animation:tail .9s ease-in-out infinite alternate}
  .cat .paw{position:absolute;top:58px;width:12px;height:28px;background:currentColor;border-radius:6px 6px 8px 8px;transform-origin:top center;animation:paw .45s infinite linear}
  .cat .paw.p1{left:40px}.cat .paw.p2{left:56px;animation-delay:-.22s}.cat .paw.p3{left:94px;animation-delay:-.22s}.cat .paw.p4{left:110px}
  .cat .ground{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line);overflow:hidden}
  .cat .ground::before{content:"";position:absolute;left:0;width:200%;height:100%;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 26px);animation:ground .6s linear infinite}
  @keyframes paw{0%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}100%{transform:rotate(14deg)}}
  @keyframes tail{from{transform:rotate(-18deg)}to{transform:rotate(24deg)}}
  @keyframes ground{to{transform:translateX(-26px)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .loadtext{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--muted);letter-spacing:.02em}
  .loadtext.static::after{display:none}
  .loadtext::after{content:"";display:inline-block;width:1.6em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:"...."}}
  .retry{padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:#fff;font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer}
  #app{opacity:0;transition:opacity .4s}
  #app.show{opacity:1}
  @media(prefers-reduced-motion:reduce){.cat *,.loadtext::after{animation:none!important}#app{transition:none}}

  .search input{width:100%;padding:20px 22px;font:500 20px 'IBM Plex Sans',sans-serif;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);outline:none}
  .search input:focus{border-color:var(--accent)}
  .hint{margin:10px 2px 0;font-size:13px;color:var(--muted);min-height:18px}
  .results{margin-top:26px;display:grid;gap:18px}
  .slip{background:var(--paper);border-radius:6px;padding:26px 28px;font-family:'IBM Plex Mono',monospace;box-shadow:0 1px 2px rgba(23,33,43,.06),0 10px 30px -14px rgba(23,33,43,.25);position:relative}
  .slip::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;background:radial-gradient(circle at 8px 10px,var(--bg) 6px,transparent 6.5px) 0 0/16px 16px repeat-x}
  .name{font-family:'DM Serif Display',serif;font-size:24px;margin:0 0 2px}
  .tel{font-size:12px;color:var(--muted);margin-bottom:8px}
  .rule{border:0;border-top:1px dashed var(--line);margin:12px 0}
  .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}
  .row small{color:var(--muted);margin-left:8px}
  .total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;font-weight:600;font-size:15px}
  .total .amt{font-size:26px;font-family:'DM Serif Display',serif;font-weight:400;background:linear-gradient(transparent 55%,var(--gold) 55%);padding:0 4px}
  .pay{margin-top:18px;font-family:'IBM Plex Sans',sans-serif}
  .pay p{margin:0 0 10px;font-size:13px;font-weight:500}
  .methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .methods button{padding:14px 8px;border:2px solid var(--line);border-radius:10px;background:var(--paper);font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer;color:var(--ink)}
  .methods button:hover,.methods button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .methods button:disabled{opacity:.5;cursor:wait}
  .paid{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--green-soft);color:#1B5E3E;font-family:'IBM Plex Sans',sans-serif;font-size:14px}
  .paid b{display:block;font-size:15px}
  .paid.wait{background:#FFF6DD;color:#6B5300}
  .details{margin-top:12px;padding:14px 16px;background:#F6F8FA;border-radius:10px;font-size:13px;line-height:1.7}
  .details img{max-width:220px;width:100%;display:block;margin:8px auto 0;border-radius:8px}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:420px){.methods{grid-template-columns:1fr}}
  .overlay{position:fixed;inset:0;background:rgba(23,33,43,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{background:var(--paper);border-radius:16px;max-width:440px;width:100%;max-height:95vh;overflow:auto;padding:24px;font-family:'IBM Plex Sans',sans-serif;position:relative}
  .modal .close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:#F0F3F6;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
  .modal .close:hover{background:var(--line);color:var(--ink)}
  .modal .change{display:block;width:100%;margin-top:10px;padding:10px;border:0;background:none;color:var(--accent);font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer;text-decoration:underline}
  .modal h3{font-family:'DM Serif Display',serif;font-weight:400;font-size:22px;margin:0 0 2px}
  .modal .who{color:var(--muted);font-size:13px;margin-bottom:14px}
  .modal img{width:100%;border-radius:10px;display:block;border:1px solid var(--line)}
  .modal .amount{margin:16px 0 4px;text-align:center;font-size:13px;color:var(--muted)}
  .modal .amount b{display:block;font-family:'DM Serif Display',serif;font-size:40px;color:var(--ink);font-weight:400;line-height:1.1}
  .modal .nota{font-size:13px;color:var(--muted);text-align:center;margin:10px 0}
  .modal .btns{display:flex;gap:8px;margin-top:16px}
  .modal .btns button{flex:1;padding:14px;border-radius:10px;font:600 15px 'IBM Plex Sans',sans-serif;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
  .modal .btns .done{background:var(--accent);border-color:var(--accent);color:#fff}
  .modal .btns button:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<header>
  <h1>Semak <em>Bayaran</em></h1>
  <p class="sub">Taip nama untuk lihat tempahan dan jumlah bayaran.</p>
</header>
<main>
  <div id="loader" role="status" aria-live="polite">
    <div class="cat" aria-hidden="true">
      <div class="tail"></div>
      <div class="body"></div>
      <div class="head"><div class="ear l"></div><div class="ear r"></div><div class="eye l"></div><div class="eye r"></div></div>
      <div class="paw p1"></div><div class="paw p2"></div><div class="paw p3"></div><div class="paw p4"></div>
      <div class="ground"></div>
    </div>
    <div class="loadtext" id="loadtext">Data sedang dimuat naik</div>
  </div>
  <div id="app">
    <div class="search"><input id="q" type="search" placeholder="Cth: Jamilah" autocomplete="off"></div>
    <p class="hint" id="hint"></p>
    <div class="results" id="results"></div>
  </div>
</main>

<script>
// >>> GAMBAR MAKLUMAT BAYARAN (dipaparkan dalam pop-up QR Code & Online Banking) <<<
const PAYMENT_IMG = 'https://raw.githubusercontent.com/Miex-1/PESMATA/refs/heads/main/payment.png';

// >>> TAMPAL URL WEB APP APPS SCRIPT AWAK DI SINI <<<
const API='https://script.google.com/macros/s/AKfycbzBhZtEt8Rfeea0FtsRhN3ajQXmAZGWKO4jybeLniRSg0yT7lQJmZ9H6Kmf9dc1q3FALw/exec';

// JSONP — berfungsi dari mana-mana laman tanpa masalah CORS
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    const s=document.createElement('script');
    s.crossOrigin='anonymous'; // hantar tanpa kuki akaun Google (elak isu banyak akaun di telefon)
    const t=setTimeout(()=>{cleanup();reject(new Error('Tiada respons dari pelayan'));},30000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=d=>{cleanup();resolve(d);};
    s.onerror=()=>{cleanup();reject(new Error('Gagal sambung ke pelayan'));};
    s.src=API+'?'+new URLSearchParams({...params,callback:cb});
    document.head.appendChild(s);
  });
}
// Cuba JSONP dahulu; jika gagal (sesetengah telefon/rangkaian), cuba fetch biasa
async function call(params){
  try{ return await jsonp(params); }
  catch(e1){
    try{
      const r=await fetch(API+'?'+new URLSearchParams(params),{redirect:'follow',credentials:'omit'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e2){ throw new Error('Tidak dapat menghubungi pelayan. Cuba buka di Chrome/Safari (bukan dari WhatsApp), tutup pemblokir iklan, atau tukar rangkaian.'); }
  }
}
const api={
  all:()=>call({action:'all'}),
  pay:(rows,method)=>call({action:'pay',rows:rows.join(','),method})
};
const $=s=>document.querySelector(s);
const rm=n=>'RM '+Number(n).toFixed(2);
let all=[], ready=false;
const norm=s=>s.toUpperCase().replace(/\s+/g,' ').trim();

// Muat semua data sekali (papar loader kucing), kemudian carian jadi serta-merta
function load(){
  $('#loader').classList.remove('hide'); $('#app').classList.remove('show');
  $('#loadtext').className='loadtext'; $('#loadtext').textContent='Data sedang dimuat naik';
  $('#loader .retry')?.remove();
  api.all().then(r=>{
    if(r.error) throw new Error(r.error);
    all=r.hits.map(h=>({...h,_n:norm(h.nama)})); ready=true;
    $('#loader').classList.add('hide'); $('#app').classList.add('show'); $('#q').focus();
    if($('#q').value.trim()) search();
  }).catch(e=>{
    $('#loadtext').className='loadtext static'; $('#loadtext').textContent=e.message;
    $('#loader').insertAdjacentHTML('beforeend','<button class="retry" onclick="load()">Cuba lagi</button>');
  });
}
load();

$('#q').addEventListener('input',search);
function search(){
  if(!ready) return;
  const v=norm($('#q').value);
  if(v.length<2){$('#results').innerHTML='';return;}
  show({hits:all.filter(h=>h._n.includes(v))});
}

function err(e){$('#hint').textContent='Ralat: '+e.message;}

function show(res){
  if(!res.hits.length){$('#results').innerHTML=`<div class="empty">Tiada order untuk "${$('#q').value}".</div>`;return;}
  const groups={};
  // Gabung order jika nama asas sama (abaikan teks dalam kurungan, cth "(ANAK)")
  const baseName=n=>n.toUpperCase().replace(/\s*[\(\[].*?[\)\]]\s*/g,' ').replace(/\s+/g,' ').trim();
  res.hits.forEach(h=>{const k=baseName(h.nama);(groups[k]=groups[k]||[]).push(h);});
  $('#results').innerHTML=Object.values(groups).slice(0,20).map(renderSlip).join('');
}

function renderSlip(g){
  const total=g.reduce((s,h)=>s+h.harga,0);
  const baseName=n=>n.toUpperCase().replace(/\s*[\(\[].*?[\)\]]\s*/g,' ').replace(/\s+/g,' ').trim();
  const base=baseName(g[0].nama);
  const rows=g.map(h=>{const tag=h.nama.match(/[\(\[].*?[\)\]]/); return `<div class="row"><span>${h.jenis}<small>${h.saiz}${tag?' · '+tag[0]:''}</small></span><span>${rm(h.harga)}</span></div>`;}).join('');
  const paidRows=g.filter(h=>h.cara);
  const rowIds=g.map(h=>h.row).join(',');
  let footer;
  if(paidRows.length===g.length){
    const h=paidRows[0];
    footer=statusBox(h.cara,h.status,h.tarikh);
  }else{
    footer=`<div class="pay" id="pay-${g[0].row}">
      <p>Pilih cara bayaran:</p>
      <div class="methods">
        <button onclick="pay('${rowIds}','CASH',this)">Cash</button>
        <button onclick="pay('${rowIds}','QR CODE',this)">QR Code</button>
        <button onclick="pay('${rowIds}','ONLINE BANKING',this)">Online Banking</button>
      </div></div>`;
  }
  return `<article class="slip" data-rows="${rowIds}">
    <h2 class="name">${base}</h2><div class="tel">${g.find(h=>h.tel)?.tel||''}${g.length>1?`<br>${g.length} order digabungkan`:''}</div>
    <hr class="rule">${rows}<hr class="rule">
    <div class="total"><span>Jumlah bayaran</span><span class="amt">${rm(total)}</span></div>
    ${footer}</article>`;
}

function statusBox(cara,status,tarikh){
  const wait=status!=='DIBAYAR';
  return `<div class="paid ${wait?'wait':''}"><b>${cara} — ${status}</b>Direkod pada ${tarikh}</div>`;
}

function pay(rowIds,method,btn){
  const slip=btn.closest('.slip');
  const nama=slip.querySelector('.name').textContent;
  const total=slip.querySelector('.total .amt').textContent;
  const cash=method==='CASH';
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="modal" role="dialog">
    <button class="close" aria-label="Tutup" title="Tutup">×</button>
    ${cash?`
    <h3>Terima kasih!</h3>
    <div class="who">${nama}</div>
    <div class="amount">Jumlah perlu dibayar secara tunai<b>${total}</b></div>
    <div class="nota">Sila serahkan bayaran kepada penganjur. Tekan Selesai untuk merekodkan pilihan anda.</div>`
    :`
    <h3>${method==='QR CODE'?'Imbas QR untuk bayar':'Maklumat pembayaran'}</h3>
    <div class="who">${nama}</div>
    <img src="${PAYMENT_IMG}" alt="Maklumat bayaran">
    <div class="amount">Jumlah perlu bayar<b>${total}</b></div>`}
    <div class="btns"><button class="cancel">Batal</button><button class="done">Selesai</button></div>
    <button class="change">Tersalah pilih? Tukar cara bayaran</button>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape')close();};
  document.addEventListener('keydown',onKey);
  ov.querySelectorAll('.cancel,.close,.change').forEach(b=>b.onclick=close);
  ov.onclick=e=>{if(e.target===ov)close();};
  ov.querySelector('.done').onclick=()=>{
    const b=ov.querySelector('.done'); b.disabled=true; b.textContent='Merekod…';
    const rows=rowIds.split(',').map(Number);
    api.pay(rows,method).then(r=>{
      if(r.error) throw new Error(r.error);
      all.forEach(h=>{if(rows.includes(h.row)){h.cara=method;h.status=r.status;h.tarikh=r.tarikh;}});
      close();
      slip.querySelector('.pay').outerHTML=statusBox(method,r.status,r.tarikh);
    }).catch(e=>{alert('Gagal rekod: '+e.message);b.disabled=false;b.textContent='Selesai';});
  };
}
</script>
</body>
</html>
